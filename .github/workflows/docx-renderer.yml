name: DOCX Renderer

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  group: resume-render-validation
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LibreOffice and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils jq

      - name: Get GitHub OIDC token
        id: oidc
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=placement-command-center-renderer"
          token=$(curl --fail --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$oidc_url" | jq -r '.value')
          test -n "$token"
          test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Fetch pending customized CV from Appwrite
        id: source
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          APPWRITE_FUNCTION_URL: https://placement-command-center-ixkc.sgp.appwrite.run/render-source
        run: |
          mkdir -p input rendered
          curl --fail --silent --show-error --location             -H "Authorization: Bearer $OIDC_TOKEN"             "$APPWRITE_FUNCTION_URL"             -o render-source.json

          status=$(jq -r '.status // "FAILED"' render-source.json)

          if [ "$status" = "NO_CV_AVAILABLE" ]; then
            echo "No pending customized CV requires validation."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -e '.status == "SUCCESS"' render-source.json >/dev/null

          file_id=$(jq -r '.file.id' render-source.json)
          file_name=$(jq -r '.file.name' render-source.json)

          jq -r '.content' render-source.json | base64 -d > input/resume.docx
          test -s input/resume.docx

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "file_id=$file_id" >> "$GITHUB_OUTPUT"
          echo "file_name=$file_name" >> "$GITHUB_OUTPUT"

      - name: Render DOCX to PDF
        if: steps.source.outputs.available == 'true'
        run: |
          libreoffice --headless --convert-to pdf --outdir rendered input/resume.docx
          test -s rendered/resume.pdf

      - name: Count rendered pages
        if: steps.source.outputs.available == 'true'
        id: pages
        run: |
          pages=$(pdfinfo rendered/resume.pdf | awk '/^Pages:/ {print $2}')
          echo "Rendered pages: $pages"
          test -n "$pages"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"

      - name: Finalize render result in Appwrite
        if: steps.source.outputs.available == 'true'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          APPWRITE_FUNCTION_URL: https://placement-command-center-ixkc.sgp.appwrite.run/render-result
          FILE_ID: ${{ steps.source.outputs.file_id }}
          PAGES: ${{ steps.pages.outputs.pages }}
        run: |
          result=$(curl --fail --silent --show-error --location             -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "{"fileId":"$FILE_ID","pages":$PAGES}"             "$APPWRITE_FUNCTION_URL")

          echo "$result" | jq .

          status=$(echo "$result" | jq -r '.status // "FAILED"')

          if [ "$status" = "VALIDATED" ] && [ "$PAGES" -eq 1 ]; then
            echo "PASS: rendered CV is exactly 1 page."
            exit 0
          fi

          echo "FAILED: CV did not pass final one-page validation."
          exit 1

      - name: Cleanup private render files
        if: always()
        run: |
          rm -f render-source.json input/resume.docx rendered/resume.pdf
