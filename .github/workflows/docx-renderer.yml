name: DOCX Renderer

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Check LibreOffice
        run: |
          libreoffice --version

      - name: Check renderer
        run: |
          mkdir -p rendered
          echo "LibreOffice renderer is ready."
